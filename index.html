<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Греческий A2: тренажёр переехал</title>
<style>
  :root { color-scheme: light dark; --bg: #eef1f6; --fg: #141a24; --a: #0d5eaf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e7ecf3; --a: #5ea2ef; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 40px 16px; }
  a { color: var(--a); font-weight: 600; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Тренажёр переехал</h1>
  <p>Новый адрес: <a id="go" href="https://greek-trainer-a2-b1.firebaseapp.com/">greek-trainer-a2-b1.firebaseapp.com</a>. На нём работает вход через Google.</p>
  <p id="st">Переносим прогресс с этого устройства…</p>
</main>
<script>
/* Старый адрес: забираем прогресс из памяти браузера и передаём на новый адрес после «#import=».
   Эта часть адреса не уходит на сервер; новая страница читает её и сразу стирает. */
(async () => {
  const NEW = 'https://greek-trainer-a2-b1.firebaseapp.com/';
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('grtr:v1:') || k === 'grtr:v1:last') continue;
      const st = JSON.parse(localStorage.getItem(k));
      if (st && ['w', 'r', 'wr'].some(f => Object.keys(st[f] || {}).length)) data[k.slice(8)] = st; // пустые копии не переносим
    }
  } catch (e) { }
  let url = NEW;
  try {
    if (Object.keys(data).length) {
      let bytes = new TextEncoder().encode(JSON.stringify(data)), p = 'j';
      if ('CompressionStream' in window) {
        bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
        p = 'z';
      }
      let s = '';
      for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      url = NEW + '#import=' + p + '.' + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch (e) { }
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
